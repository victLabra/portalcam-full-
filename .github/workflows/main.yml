name: Build PortalCam Full APK - ONE FILE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/android/cmdline-tools/latest
          mv cmdline-tools/* $HOME/android/cmdline-tools/latest/ 2>/dev/null || true
          mv lib/* $HOME/android/cmdline-tools/latest/lib/ 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
          echo "$HOME/android/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android/platform-tools" >> $GITHUB_PATH
          yes | $HOME/android/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Generate Android Project (no need to upload folders)
        run: |
          rm -rf android
          mkdir -p android/app/src/main/java/com/portalcam
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/gradle/wrapper

          # settings.gradle
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PortalCam-Full"
          include ':app'
          EOF

          # root build.gradle
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          # app build.gradle
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.portalcam'
              compileSdk 34
              defaultConfig {
                  applicationId "com.portalcam"
                  minSdk 28
                  targetSdk 29
                  versionCode 2
                  versionName "2.0-grupo-5"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'com.google.mlkit:face-detection:16.1.7'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # gradle wrapper properties
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # gradlew
          cat > android/gradlew <<'EOF'
          #!/usr/bin/env sh
          APP_HOME=$( cd "${0%/*}" && pwd -P ) || exit
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -Dorg.gradle.appname=Gradle -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x android/gradlew

          # Download wrapper jar
          curl -L -o android/gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar

          # AndroidManifest.xml
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <application android:label="PortalCam Full">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".UsbCamFullService" android:foregroundServiceType="camera|microphone" />
              </application>
          </manifest>
          EOF

          # FaceTracker.kt - tu version afinada 4-5 personas
          cat > android/app/src/main/java/com/portalcam/FaceTracker.kt <<'FTEOF'

package com.portalcam

import android.graphics.Rect
import kotlin.math.*

// FaceTracker afinado para grupo grande 4-5 personas - reunion familiar
class FaceTracker {
    data class TrackedFrame(val cropRect: Rect, val faceCount: Int, val isGroup: Boolean, val zoom: Float)

    private var smoothedCenterX = 0.5f
    private var smoothedCenterY = 0.48f // ligeramente arriba para cabezas
    private var smoothedZoom = 1f
    private val smoothFast = 0.18f   // para 1 persona
    private val smoothSlow = 0.08f   // para grupo 4-5, mas estable
    private var lastGroupCount = 0

    fun update(faces: List<Rect>, frameWidth: Int, frameHeight: Int): TrackedFrame {
        if (faces.isEmpty()) {
            smoothedCenterX += (0.5f - smoothedCenterX) * 0.02f
            smoothedCenterY += (0.48f - smoothedCenterY) * 0.02f
            smoothedZoom += (1f - smoothedZoom) * 0.02f
            return TrackedFrame(Rect(0,0,frameWidth,frameHeight), 0, false, smoothedZoom)
        }

        // Bounding box grupal con padding extra para 4-5 personas
        var left = frameWidth
        var top = frameHeight
        var right = 0
        var bottom = 0
        for (f in faces) {
            left = min(left, f.left)
            top = min(top, f.top)
            right = max(right, f.right)
            bottom = max(bottom, f.bottom)
        }
        val groupW = (right - left).toFloat()
        val groupH = (bottom - top).toFloat()
        val groupCenterX = (left + right) / 2f / frameWidth
        val groupCenterY = (top + bottom) / 2f / frameHeight

        val isGroup = faces.size >= 2
        val isLargeGroup = faces.size >= 4

        // Zoom con padding generoso para grupo grande
        val padding = when {
            faces.size >= 5 -> 0.35f
            faces.size >= 4 -> 0.30f
            faces.size >= 3 -> 0.25f
            faces.size == 2 -> 0.20f
            else -> 0.12f
        }

        val spanX = groupW / frameWidth
        val spanY = groupH / frameHeight
        val maxSpan = max(spanX, spanY)

        val targetZoom = when {
            isLargeGroup -> (maxSpan + padding).coerceIn(0.85f, 1f) // casi full frame para 4-5
            isGroup -> (maxSpan + padding).coerceIn(0.70f, 0.95f)
            else -> 0.50f // close-up individual
        }

        val smooth = if (isLargeGroup) smoothSlow else smoothFast
        smoothedCenterX += (groupCenterX - smoothedCenterX) * smooth
        smoothedCenterY += (groupCenterY - smoothedCenterY) * smooth
        smoothedZoom += (targetZoom - smoothedZoom) * (smooth * 0.6f)

        // Evita que el crop se vaya fuera con grupo grande
        val cropW = (frameWidth * smoothedZoom).toInt()
        val cropH = (frameHeight * smoothedZoom).toInt()
        val centerXpx = (smoothedCenterX * frameWidth).toInt()
        val centerYpx = (smoothedCenterY * frameHeight).toInt()

        var cropLeft = (centerXpx - cropW/2).coerceIn(0, frameWidth - cropW)
        var cropTop = (centerYpx - cropH/2).coerceIn(0, frameHeight - cropH)
        // Para grupo, baja un poco el encuadre para no cortar cabezas
        if (isGroup) cropTop = (cropTop - frameHeight*0.05f).toInt().coerceAtLeast(0)

        lastGroupCount = faces.size
        return TrackedFrame(Rect(cropLeft, cropTop, cropLeft+cropW, cropTop+cropH), faces.size, isGroup, smoothedZoom)
    }
}

FTEOF

          # MainActivity.kt (simplified full cam)
          cat > android/app/src/main/java/com/portalcam/MainActivity.kt <<'EOF'
          package com.portalcam
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // Simple preview - full service handles USB
                  val intent = android.content.Intent(this, UsbCamFullService::class.java)
                  startForegroundService(intent)
                  finish()
              }
          }
          EOF

          # UsbCamFullService.kt - simplified
          cat > android/app/src/main/java/com/portalcam/UsbCamFullService.kt <<'EOF'
          package com.portalcam
          import android.app.*
          import android.content.Intent
          import android.os.IBinder
          import androidx.camera.core.*
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.core.content.ContextCompat
          import com.google.mlkit.vision.face.FaceDetection
          import com.google.mlkit.vision.face.FaceDetectorOptions
          import java.net.ServerSocket
          import java.io.OutputStream
          import java.nio.ByteBuffer
          import java.util.concurrent.Executors

          class UsbCamFullService : Service() {
              private var serverThread: Thread? = null
              override fun onBind(intent: Intent?): IBinder? = null
              override fun onCreate() {
                  super.onCreate()
                  val channel = NotificationChannel("portalcam", "PortalCam", NotificationManager.IMPORTANCE_LOW)
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)
                  val notif = Notification.Builder(this, "portalcam").setContentTitle("PortalCam Full").setContentText("Tracking 4-5 personas por USB").setSmallIcon(android.R.drawable.ic_menu_camera).build()
                  startForeground(1, notif)
                  startServer()
              }
              private fun startServer() {
                  serverThread = Thread {
                      try {
                          val server = ServerSocket(8888)
                          while (true) {
                              val client = server.accept()
                              // Stream placeholder - full implementation in original repo
                              client.close()
                          }
                      } catch (e: Exception) { e.printStackTrace() }
                  }
                  serverThread?.start()
              }
          }
          EOF

          echo "Project generated"

      - name: Build APK Debug
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${ env.ANDROID_HOME }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PortalCam-Full-Grupo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
